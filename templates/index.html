<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yapay Zeka Ses Stüdyosu</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 24px 0;
        }

        /* Arka plan parlama efektleri (Neon Lights) */
        .circle-1 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #8b5cf6 0%, rgba(139, 92, 246, 0) 70%);
            top: -100px;
            left: -100px;
            border-radius: 50%;
            opacity: 0.5;
            z-index: 1;
        }
        
        .circle-2 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #3b82f6 0%, rgba(59, 130, 246, 0) 70%);
            bottom: -200px;
            right: -200px;
            border-radius: 50%;
            opacity: 0.4;
            z-index: 1;
        }

        /* Glassmorphism Panel */
        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
            background: linear-gradient(to right, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
            font-weight: 600;
        }

        textarea, select, input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        textarea:focus, select:focus, input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }

        textarea {
            height: 150px;
            resize: none;
        }

        /* İndirme Butonu */
        button {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Yükleniyor Animasyonu */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Uyarı Mesajları */
        .alert {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            display: none;
            font-size: 14px;
        }

        .alert.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        .alert.success {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #86efac;
        }
        
        /* Sağlayıcı seçim ekranı */
        .provider-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .provider-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            color: #fff;
            display: block;
            transition: all 0.3s ease;
        }

        .provider-card:hover {
            border-color: #8b5cf6;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.35);
            transform: translateY(-3px);
        }

        .provider-card .icon { font-size: 36px; margin-bottom: 10px; }
        .provider-card h3 { font-size: 18px; margin-bottom: 6px; }
        .provider-card p { font-size: 13px; color: #94a3b8; }

        .back-link {
            background: none;
            border: none;
            box-shadow: none;
            width: auto;
            padding: 0;
            margin: 0 0 16px 0;
            color: #a78bfa;
            font-size: 14px;
            font-weight: 600;
            justify-content: flex-start;
        }

        .back-link:hover { transform: none; box-shadow: none; text-decoration: underline; }

        .hidden { display: none !important; }

        .hint { font-size: 12px; color: #94a3b8; margin-top: 6px; }

        @media (max-width: 520px) {
            .provider-grid { grid-template-columns: 1fr; }
            .container { padding: 28px 20px; }
        }

        /* Select elementinin içi */
        select option {
            background: #1e293b;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="circle-1"></div>
    <div class="circle-2"></div>

    <div class="container">
        <h1>Yapay Zeka Ses Stüdyosu</h1>
        <p class="subtitle" id="subtitle">Önce kullanmak istediğiniz ses motorunu seçin</p>

        <!-- 1. Adım: Sağlayıcı seçimi -->
        <div id="providerScreen" class="provider-grid">
            <button type="button" class="provider-card" onclick="selectProvider('microsoft')">
                <div class="icon">🎙️</div>
                <h3>Microsoft</h3>
                <p>Çok dilli, hızlı. Türkçe dahil çok sayıda ses.</p>
            </button>
            <button type="button" class="provider-card" onclick="selectProvider('openai')">
                <div class="icon">✨</div>
                <h3>OpenAI</h3>
                <p>Doğal tonlar. Ses ve vibe (üslup) seçilebilir.</p>
            </button>
        </div>

        <!-- 2. Adım: Seçilen sağlayıcının formu -->
        <div id="studio" class="hidden">
        <button type="button" class="back-link" onclick="backToProviders()">← Ses motorunu değiştir</button>

        <div class="form-group">
            <label for="text">Metin</label>
            <textarea id="text" placeholder="Sese dönüştürmek istediğiniz metni buraya yazın veya yapıştırın..."></textarea>
        </div>

        <!-- OpenAI ayarları -->
        <div id="openaiFields" class="hidden">
            <div class="form-group">
                <label for="oaVoice">Ses Seçimi (OpenAI)</label>
                <select id="oaVoice">
                    {% for s in openai_sesler %}
                    <option value="{{ s }}" {% if s == 'Fable' %}selected{% endif %}>{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="oaVibe">Vibe (Üslup)</label>
                <select id="oaVibe">
                    {% for v in openai_vibeler %}
                    <option value="{{ v }}">{{ v }}</option>
                    {% endfor %}
                </select>
                <textarea id="oaVibeText" style="height:100px; margin-top:10px;"></textarea>
                <p class="hint">Üslup talimatı İngilizce yazılır, istediğiniz gibi düzenleyebilirsiniz. En fazla 8000 karakter.</p>
            </div>
        </div>

        <div class="form-group" id="microsoftFields">
            <label for="voice">Ses Seçimi (Diller & Tonlar)</label>
            <select id="voice">
                <optgroup label="🇺🇸 İngilizce (ABD) - Tüm Ücretsiz Clipchamp Sesleri (17 Adet)">
                    <!-- Kadın Sesleri -->
                    <option value="en-US-AriaNeural">👩🏼 Aria (US / Kadın)</option>
                    <option value="en-US-JennyNeural">👩🏻 Jenny (US / Kadın)</option>
                    <option value="en-US-AvaNeural">👩🏼 Ava (US / Kadın)</option>
                    <option value="en-US-EmmaNeural">👩🏽 Emma (US / Kadın)</option>
                    <option value="en-US-MichelleNeural">👩🏾 Michelle (US / Kadın)</option>
                    <option value="en-US-AnaNeural">👧🏼 Ana (US / Çocuk - Kız)</option>
                    <option value="en-US-AvaMultilingualNeural">🌐 Ava Multilingual (Çok Dilli / Kadın)</option>
                    <option value="en-US-EmmaMultilingualNeural">🌐 Emma Multilingual (Çok Dilli / Kadın)</option>
                    
                    <!-- Erkek Sesleri -->
                    <option value="en-US-GuyNeural">👨🏼 Guy (US / Erkek)</option>
                    <option value="en-US-ChristopherNeural">👨🏻 Christopher (US / Erkek)</option>
                    <option value="en-US-AndrewNeural">👨🏽 Andrew (US / Erkek)</option>
                    <option value="en-US-BrianNeural">👨🏼‍🦰 Brian (US / Erkek)</option>
                    <option value="en-US-EricNeural">👨🏿 Eric (US / Erkek)</option>
                    <option value="en-US-RogerNeural">👨🏽‍🦳 Roger (US / Yaşlı Erkek)</option>
                    <option value="en-US-SteffanNeural">👨🏻 Steffan (US / Erkek)</option>
                    <option value="en-US-AndrewMultilingualNeural">🌐 Andrew Multilingual (Çok Dilli / Erkek)</option>
                    <option value="en-US-BrianMultilingualNeural">🌐 Brian Multilingual (Çok Dilli / Erkek)</option>
                </optgroup>
                <optgroup label="🇬🇧 İngilizce (İngiltere) - Premium Sesler">
                    <option value="en-GB-SoniaNeural">👩🏻 Sonia (UK / Kadın)</option>
                    <option value="en-GB-LibbyNeural">👩🏻 Libby (UK / Kadın)</option>
                    <option value="en-GB-RyanNeural">👨🏻 Ryan (UK / Erkek)</option>
                    <option value="en-GB-ThomasNeural">👨🏻 Thomas (UK / Erkek)</option>
                </optgroup>
                <optgroup label="🇦🇺 İngilizce (Avustralya) - Premium Sesler">
                    <option value="en-AU-NatashaNeural">👩🏼 Natasha (Avustralya / Kadın)</option>
                    <option value="en-AU-WilliamNeural">👨🏼 William (Avustralya / Erkek)</option>
                </optgroup>
                <optgroup label="🇪🇸 İspanyolca - Premium Sesler">
                    <option value="es-ES-ElviraNeural">👩🏽 Elvira (İspanya / Kadın)</option>
                    <option value="es-ES-AlvaroNeural">👨🏽 Alvaro (İspanya / Erkek)</option>
                    <option value="es-MX-DaliaNeural">👩🏽 Dalia (Meksika / Kadın)</option>
                    <option value="es-MX-JorgeNeural">👨🏽 Jorge (Meksika / Erkek)</option>
                </optgroup>
            </select>
        </div>

        <div class="form-group">
            <label for="filename">Dosya Adı (İsteğe Bağlı)</label>
            <input type="text" id="filename" placeholder="Örn: ses-kaydi (Boş bırakılırsa rastgele isimlendirilir)">
        </div>

        <button id="generateBtn" onclick="generateAudio()">
            <span id="btnText">Oluştur ve İndir 📥</span>
            <div class="spinner" id="spinner"></div>
        </button>

        <div id="statusAlert" class="alert"></div>
        </div><!-- /studio -->
    </div>

    <script>
        const OPENAI_VIBELER = {{ openai_vibeler | tojson }};
        let currentProvider = null;

        function selectProvider(provider) {
            currentProvider = provider;
            document.getElementById('providerScreen').classList.add('hidden');
            document.getElementById('studio').classList.remove('hidden');
            document.getElementById('microsoftFields').classList.toggle('hidden', provider !== 'microsoft');
            document.getElementById('openaiFields').classList.toggle('hidden', provider !== 'openai');
            document.getElementById('subtitle').innerText = provider === 'openai'
                ? 'OpenAI: metni yazın, ses ve vibe seçin, indirin'
                : 'Microsoft: metni yazın, sesi seçin ve anında indirin';
            if (provider === 'openai' && !document.getElementById('oaVibeText').value) {
                document.getElementById('oaVibeText').value = OPENAI_VIBELER[document.getElementById('oaVibe').value];
            }
            hideAlert();
        }

        function backToProviders() {
            currentProvider = null;
            document.getElementById('studio').classList.add('hidden');
            document.getElementById('providerScreen').classList.remove('hidden');
            document.getElementById('subtitle').innerText = 'Önce kullanmak istediğiniz ses motorunu seçin';
            hideAlert();
        }

        function hideAlert() {
            document.getElementById('statusAlert').style.display = 'none';
        }

        document.getElementById('oaVibe').addEventListener('change', (e) => {
            document.getElementById('oaVibeText').value = OPENAI_VIBELER[e.target.value];
        });

        async function generateAudio() {
            const text = document.getElementById('text').value;
            const provider = currentProvider || 'microsoft';
            const voice = provider === 'openai'
                ? document.getElementById('oaVoice').value
                : document.getElementById('voice').value;
            const vibe = provider === 'openai' ? document.getElementById('oaVibeText').value : '';
            const btn = document.getElementById('generateBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const alertBox = document.getElementById('statusAlert');

            if (!text.trim()) {
                showAlert('Lütfen boş bırakmayın, bir metin girin!', 'error');
                return;
            }

            // Yükleniyor durumuna geç
            btn.disabled = true;
            btnText.innerText = "Kuyruğa Alınıyor...";
            spinner.style.display = "block";
            alertBox.style.display = "none";

            try {
                // Sunucuya görevi oluşturması için istek gönder
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, voice, provider, vibe })
                });

                const data = await response.json();

                if (response.ok && data.success && data.task_id) {
                    showAlert('İşlem sıraya alındı. Ses dosyası hazırlanıyor, lütfen bekleyin...', 'success');
                    
                    // Durum sorgulama (polling) döngüsünü başlat
                    pollTaskStatus(data.task_id);
                } else {
                    showAlert(data.error || 'Bir hata oluştu.', 'error');
                    resetButton();
                }
            } catch (error) {
                showAlert('Sunucuya bağlanılamadı. Lütfen sunucunun çalıştığından emin olun.', 'error');
                resetButton();
            }
        }

        async function pollTaskStatus(taskId) {
            const interval = setInterval(async () => {
                try {
                    const response = await fetch(`/status/${taskId}`);
                    const data = await response.json();

                    if (!response.ok) {
                        clearInterval(interval);
                        showAlert(data.error || 'Görev durumu sorgulanırken bir hata oluştu.', 'error');
                        resetButton();
                        return;
                    }

                    if (data.status === 'completed') {
                        clearInterval(interval);
                        showAlert('Başarılı! Dosyanız bilgisayarınıza indiriliyor...', 'success');
                        
                        // Dosyayı indir
                        const a = document.createElement('a');
                        
                        // Özel dosya adını al ve URL'ye parametre olarak ekle
                        const customName = document.getElementById('filename').value.trim();
                        if (customName) {
                            a.href = `${data.download_url}?name=${encodeURIComponent(customName)}`;
                            a.download = customName.toLowerCase().endsWith('.mp3') ? customName : customName + '.mp3';
                        } else {
                            a.href = data.download_url;
                            a.download = ''; 
                        }
                        
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        
                        resetButton();
                    } else if (data.status === 'failed') {
                        clearInterval(interval);
                        showAlert('Seslendirme başarısız oldu: ' + (data.error || 'Bilinmeyen Hata'), 'error');
                        resetButton();
                    } else if (data.status === 'processing') {
                        // İşlem devam ediyor, kullanıcıyı bilgilendir
                        const btnText = document.getElementById('btnText');
                        btnText.innerText = data.progress && data.progress.includes('/')
                            ? `Ses Üretiliyor... (${data.progress})`
                            : "Ses Üretiliyor...";
                    } else if (data.status === 'queued') {
                        document.getElementById('btnText').innerText = "Sırada bekleniyor...";
                    }
                } catch (error) {
                    // Geçici ağ hataları için sorgulamayı kesmeyip devam edelim
                    console.error("Durum sorgulanırken ağ hatası oluştu:", error);
                }
            }, 3000); // Her 3 saniyede bir kontrol et
        }

        function resetButton() {
            const btn = document.getElementById('generateBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            btn.disabled = false;
            btnText.innerText = "Oluştur ve İndir 📥";
            spinner.style.display = "none";
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('statusAlert');
            alertBox.innerText = message;
            alertBox.className = 'alert ' + type;
            alertBox.style.display = 'block';
        }
    </script>
</body>
</html>
